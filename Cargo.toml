[package]
name = "metadata-extractor"
version = "0.1.0"
edition = "2021"
authors = ["Metadata Extractor Team"]
description = "High-throughput asynchronous directory walker for media discovery with backpressured batch streaming"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
jwalk = "0.8"
rayon = "1.10"
phf = { version = "0.11", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
metrics = "0.24"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
nom-exif = "3.8"
kamadak-exif = "0.6"
blake3 = { version = "1.8", features = ["rayon", "mmap"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
mongodb = "3.2"
futures = "0.3"
dotenvy = "0.15"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.14"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "scanner_bench"
harness = false

[[bench]]
name = "metadata_bench"
harness = false

[[bench]]
name = "dedup_bench"
harness = false
